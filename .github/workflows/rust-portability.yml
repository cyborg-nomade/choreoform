name: Rust portability probe

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-and-wasm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Format, native tests and compile-fail tests
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
      - name: Lint both targets and compile browser core
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p choreoform-portability --lib --target wasm32-unknown-unknown --locked -- -D warnings
          cargo build -p choreoform-portability --lib --release --target wasm32-unknown-unknown --locked
          cargo clippy -p choreoform-text-prototype --lib --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p choreoform-contract-probe --lib --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p choreoform-authoring-frontend --lib --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p choreoform-semantic-check --lib --target wasm32-unknown-unknown --locked -- -D warnings
          cargo build -p choreoform-authoring-frontend --lib --release --target wasm32-unknown-unknown --locked
      - name: Native report and independent wire oracle
        run: |
          cargo run -p choreoform-portability --locked -- suite target/native.json
          python3 -m venv .tools/ir-check
          .tools/ir-check/bin/pip install --require-hashes --only-binary=:all: -r tools/portability/requirements.txt
          .tools/ir-check/bin/python tools/check_ir_fixtures.py
          .tools/ir-check/bin/python tools/check_contract_suite.py
          .tools/ir-check/bin/python tools/check_authoring_evidence.py
          .tools/ir-check/bin/python tools/check_authoring_profile.py
          .tools/ir-check/bin/python tools/portability/check_report.py target/native.json
          cargo build -p choreoform-text-prototype --locked
          .tools/ir-check/bin/python tools/check_text_prototype.py
          cargo build -p choreoform-authoring-frontend --locked
          .tools/ir-check/bin/python tools/build_rp01_benchmark.py --check --probe-profile
          .tools/ir-check/bin/python tools/check_authoring_frontend.py
          .tools/ir-check/bin/python tools/check_static_contracts.py
          .tools/ir-check/bin/python tools/check_control_availability.py
          .tools/ir-check/bin/python tools/check_protection_flow.py
          .tools/ir-check/bin/python tools/check_lifecycle_links.py
          .tools/ir-check/bin/python tools/check_invalidation.py
          .tools/ir-check/bin/python tools/check_concurrency.py
          .tools/ir-check/bin/python tools/check_clock_contract.py
          .tools/ir-check/bin/python tools/check_timing.py
          .tools/ir-check/bin/python tools/check_instance_calendar.py
          .tools/ir-check/bin/python tools/check_retry_contract.py
          .tools/ir-check/bin/python tools/check_retry_authoring.py
          .tools/ir-check/bin/python tools/check_settlement_dependencies.py
          .tools/ir-check/bin/python tools/check_value_conformance.py
          .tools/ir-check/bin/python tools/check_fault_routes.py
          .tools/ir-check/bin/python tools/check_exceptional_availability.py
          .tools/ir-check/bin/python tools/check_reconciliation_links.py
          .tools/ir-check/bin/python tools/check_qualified_endpoints.py
          .tools/ir-check/bin/python tools/check_reconciliation_availability.py
          .tools/ir-check/bin/python tools/check_source_diagnostics.py
          .tools/ir-check/bin/python tools/check_static_diagnostics.py
          .tools/ir-check/bin/python tools/check_benchmark_profile.py
          .tools/ir-check/bin/python tools/check_rp01_package.py
          .tools/ir-check/bin/python tools/check_policy_reads.py
          .tools/ir-check/bin/python tools/check_metadata_authoring.py
          .tools/ir-check/bin/python tools/check_closed_provenance.py
          .tools/ir-check/bin/python tools/check_invalidation_requirements.py
          .tools/ir-check/bin/python tools/check_isolated_survivors.py
          .tools/ir-check/bin/python tools/check_rp01_guard_snapshots.py
          .tools/ir-check/bin/python tools/check_provider_fault_sources.py
          .tools/ir-check/bin/python tools/check_retry_fault_binding.py
          .tools/ir-check/bin/python tools/check_fault_source_authoring.py
          .tools/ir-check/bin/python tools/check_late_observation_boundaries.py
          .tools/ir-check/bin/python tools/check_terminal_observation_sources.py
          .tools/ir-check/bin/python tools/check_wait_capture.py
          .tools/ir-check/bin/python tools/check_wait_capture_authoring.py
          .tools/ir-check/bin/python tools/check_owned_local_followups.py
          .tools/ir-check/bin/python tools/check_fault_entry_boundaries.py
          .tools/ir-check/bin/python tools/check_general_fault_use.py
          .tools/ir-check/bin/python tools/check_general_fault_authoring.py
          .tools/ir-check/bin/python tools/check_fault_history.py
          .tools/ir-check/bin/python tools/check_fault_origins.py
          .tools/ir-check/bin/python tools/check_fault_entry.py
          .tools/ir-check/bin/python tools/check_handler_entry_authoring.py
          .tools/ir-check/bin/python tools/check_retained_request.py
          .tools/ir-check/bin/python tools/check_request_retention_authoring.py
          .tools/ir-check/bin/python tools/check_owned_readonly.py
          .tools/ir-check/bin/python tools/check_readonly_continuation_authoring.py
          .tools/ir-check/bin/python tools/check_pre_capture_entry.py
          .tools/ir-check/bin/python tools/check_pre_capture_authoring.py
          .tools/ir-check/bin/python tools/check_finite_owned_work.py
          .tools/ir-check/bin/python tools/check_finite_work_authoring.py
          .tools/ir-check/bin/python tools/check_rp01_current_contract.py
          .tools/ir-check/bin/python tools/check_rp01_capture_checkpoint.py
          .tools/ir-check/bin/python tools/build_rp03_benchmark.py --check
          .tools/ir-check/bin/python tools/check_rp03_package.py
          .tools/ir-check/bin/python tools/check_source_capacity.py
          .tools/ir-check/bin/python tools/check_compensation_references.py
          .tools/ir-check/bin/python tools/check_compensation_identity.py
          .tools/ir-check/bin/python tools/check_compensation_authoring.py
          .tools/ir-check/bin/python tools/check_rp03_symbol_binding.py
          .tools/ir-check/bin/python tools/check_rp03_current_checkpoint.py
          .tools/ir-check/bin/python tools/check_rp03_template_binding.py
      # Browser execution is a separate manual evidence step, not implied by CI.
